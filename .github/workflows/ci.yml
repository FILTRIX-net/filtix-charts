name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npx --yes npm@12.0.2 ci
      - run: npm run check
      - run: npm run build:demo
      - run: npm run build:demo:public
      - run: npm run check:demo:public
      - run: npm run pack:local
      - run: npm run check:consumer
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:demo:public
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/public-demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
  deploy-demo:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still the current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          FILTRIX_REPOSITORY: ${{ github.repository }}
          FILTRIX_REVISION: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${FILTRIX_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" = "$FILTRIX_REVISION" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an obsolete main revision."
          fi
      - name: Deploy public demo
        id: deployment
        if: steps.revision.outputs.current == 'true'
        uses: actions/deploy-pages@v4
